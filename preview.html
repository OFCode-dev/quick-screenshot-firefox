<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screenshot captured</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, sans-serif;
      background: #1c1b22;
      color: #fbfbfe;
      text-align: center;
    }
    #hint { margin: 0 0 12px; font-size: 15px; }
    #copy {
      padding: 10px 24px;
      margin-bottom: 16px;
      font-size: 15px;
      border: none;
      border-radius: 6px;
      background: #0060df;
      color: #fff;
      cursor: pointer;
    }
    #copy:disabled { background: #52525e; cursor: default; }
    #shot {
      max-width: 100%;
      height: auto;
      border: 1px solid #52525e;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <p id="hint">Screenshot captured. Tap “Copy image”, or long-press the image to save or share it.</p>
  <button id="copy">Copy image</button>
  <div><img id="shot" alt="Captured screenshot"></div>
  <script src="preview.js"></script>
</body>
</html>
